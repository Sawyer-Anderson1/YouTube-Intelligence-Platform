name: CI/CD

on:
  push:
    branches: [ main, maksim ]
  pull_request:
    branches: [ main, maksim ]
    
jobs:
  build:
    - name: Check disk usage
    run: df -h

    - name: List largest directories
    run: du -sh /* 2>/dev/null | sort -hr | head -n 10

    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      # 1. Check out the repo
      - uses: actions/checkout@v3

      # 2. Set up Python
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload Artifact for Deployment Jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.venv/
            !.git/
            !**/__pycache__/

      # 4. Optional: install extra packages for testing
      # - pip install pytest

      # 5. Run Python scripts to check for syntax
      # doesn't actually execute, to avoid needing to import the API keys here
      - name: Check Syntax on Key Files
        run: | 
          python -m py_compile src/llm/vector.py
          python -m py_compile src/llm/rag.py
          python -m py_compile src/main.py
          echo "All files passed syntax checking"

