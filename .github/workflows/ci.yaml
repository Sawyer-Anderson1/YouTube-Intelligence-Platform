name: CI/CD

on:
  push:
    branches: [ main, maksim ]
  pull_request:
    branches: [ main, maksim ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. Check out the repo
      - uses: actions/checkout@v3

      # 2. Set up Python
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload Artifact for Deployment Jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.venv/
            !.git/
            !**/__pycache__/

      # 4. Optional: install extra packages for testing
      # - pip install pytest

      # 5. Run Python scripts to make sure they execute without errors
      - name: Run vector embedding script
        run: python -m src.llm.vector

      - name: Run main app (check for syntax errors)
        run: python -m src.__main__ --help || true

