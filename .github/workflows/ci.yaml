name: CI/CD

on:
  push:
    branches: [ main, maksim ]
  pull_request:
    branches: [ main, maksim ]
    
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. Check out the repo
      - uses: actions/checkout@v3

      # 2. Set up Python
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Check disk usage
        run: df -h

      - name: List largest directories
        run: du -sh /* 2>/dev/null | sort -hr | head -n 10
      
      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: List largest pip packages
        run: pip list --format=columns | head -n 30
      
      - name: Upload Artifact for Deployment Jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.venv/
            !.git/
            !**/__pycache__/

      # 4. Optional: install extra packages for testing
      # - pip install pytest

      # 5. Run Python scripts to check for syntax
      # doesn't actually execute, to avoid needing to import the API keys here
      - name: Check Syntax on Key Files
        run: | 
          python -m py_compile src/llm/vector.py
          python -m py_compile src/llm/rag.py
          python -m py_compile src/main.py
          echo "All files passed syntax checking"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: youtube-intelligence-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
        env:
          SCM_DO_BUILD_DURING_DEPLOYMENT: true