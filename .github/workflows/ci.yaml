name: CI/CD

on:
  push:
    branches: [ main, maksim, sawyeranderson]
  pull_request:
    branches: [ main, maksim ]
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. Check out the repo
      - uses: actions/checkout@v3

      # 2. Set up Python
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Check disk usage
        run: df -h

      - name: List largest directories
        run: du -sh /* 2>/dev/null | sort -hr | head -n 10

      # 3. Install dependencies into venv
      - name: Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: List largest pip packages
        run: |
          source antenv/bin/activate
          pip list --format=columns | head -n 30

      - name: Check Syntax on Key Files
        run: | 
          source antenv/bin/activate
          python -m py_compile src/llm/vector.py
          python -m py_compile src/llm/rag.py
          python -m py_compile src/main.py
          echo "All files passed syntax checking"

      - name: Upload Artifact for Deployment Jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git/
            !**/__pycache__/
            !tests/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: youtube-intelligence-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
          enable-oryx-build: true
